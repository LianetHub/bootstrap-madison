<div class="trial-lesson__main d-flex flex-column">
    <div class="trial-lesson__caption d-flex ps-sm-2">
        <span class="trial-lesson__caption-icon flex-shrink-0">
            <img src="@img/icons/gift.svg" alt="Иконка">
        </span>
        <span class="trial-lesson__caption-text font-unbounded fw-bold lh-base text-uppercase text-center">
            <span class="color-accent">Дарим 800 ₽</span> на абонемент в&nbsp;день пробного занятия
        </span>
    </div>
    <form action="#" id="sign-up" class="trial-lesson__form bg-white text-black rounded-4 flex-grow-1">
        <div class="trial-lesson__form-caption fw-bold text-center">Запишись на пробный урок</div>
        <div class="trial-lesson__form-fields">
            <div class="row">
                <div class="col-12">
                    <input type="text" required name="username" class="form-control" placeholder="Ваше имя*">
                </div>
                <div class="col-sm-6">
                    <input type="tel" required name="phone" class="form-control" placeholder="Телефон*">
                </div>
                <div class="col-sm-6">
                    <input type="text" name="telegram" class="form-control" placeholder="@telegram_nickname">
                </div>
                <div class="col-12">
                    <p class="caption-text mb-4">Выберите удобный канал для связи</p>
                    <div class="form-checkboxes d-flex flex-wrap">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="contactMethod" id="phone" value="phone">
                            <label class="form-check-label" for="phone">Телефон</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="contactMethod" id="max" value="max">
                            <label class="form-check-label" for="max">MAX</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="contactMethod" id="telegram" value="telegram" checked>
                            <label class="form-check-label" for="telegram">Telegram</label>
                        </div>
                    </div>
                </div>
                <div class="col-12 d-flex flex-sm-row flex-column align-items-center gap-3">
                    <div class="form-check d-flex  justify-content-center align-items-center">
                        <input class="form-check-input me-2" type="checkbox" id="consent" name="consent" required>
                        <label class="form-check-label mb-0 form-policy" for="consent">
                            <span>
                                Я ознакомлен(а) и соглашаюсь с <a href="" class="form-policy__link color-accent">Политикой конфиденциальности</a> и даю <a href="" class="form-policy__link color-accent">согласие</a> на <a href="" class="form-policy__link color-accent">обработку персональных данных</a>.
                            </span>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary mx-auto">Записаться</button>
                </div>
            </div>
        </div>
    </form>
</div>
