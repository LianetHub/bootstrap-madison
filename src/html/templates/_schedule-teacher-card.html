<div class="col-xl-4 col-lg-6">
    <div class="schedule-teacher d-flex bg-white overflow-hidden h-100">
        <div class="schedule-teacher__image flex-shrink-0 overflow-hidden">
            <img src="@@image" class="schedule-teacher__photo object-fit-cover w-100 h-100" alt="@@name">
        </div>
        <div class="schedule-teacher__content d-flex flex-column justify-content-between flex-grow-1">
            <div class="schedule-teacher__info">
                <div class="schedule-teacher__name fw-bold">@@name</div>
                <div class="schedule-teacher__desc">@@description</div>
            </div>
            <a href="@@link" class="schedule-teacher__link color-accent d-inline-flex align-items-center fw-medium icon-external-link">
                <span>На страницу преподавателя</span>
            </a>
        </div>
    </div>
</div>
