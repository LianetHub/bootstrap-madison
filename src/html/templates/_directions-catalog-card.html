<div class="directions-catalog__card-col col-12 col-lg-8 @@position">
    <article class="directions-catalog__card directions-catalog__card--@@slug bg-white rounded-4 d-flex flex-column flex-lg-row">
        <div class="directions-catalog__photo directions-catalog__photo--@@slug rounded-3 overflow-hidden position-relative flex-shrink-0 align-self-lg-start">
            <img src="@img/directions-page/@@image" class="directions-catalog__image d-block h-100 object-fit-cover position-absolute top-0 start-0" alt="@@title" loading="lazy">
            @@if (slug === "kids68") {
                <p class="directions-catalog__age position-absolute font-unbounded fw-bold text-nowrap mb-0">
                    6—8
                    <span class="d-block">лет</span>
                </p>
            }
            @@if (slug === "kids911") {
                <p class="directions-catalog__age position-absolute font-unbounded fw-bold text-nowrap mb-0">
                    9—11
                    <span class="d-block">лет</span>
                </p>
            }
        </div>
        <div class="directions-catalog__card-body d-flex flex-column flex-grow-1">
            <h4 class="directions-catalog__card-title fw-bold mb-0">@@title</h4>
            <div class="directions-catalog__divider" aria-hidden="true"></div>
            <p class="directions-catalog__card-description d-none d-lg-block mb-0">@@description</p>
            <p class="directions-catalog__card-description d-lg-none mb-0">@@descriptionMobile</p>
        </div>
    </article>
</div>
